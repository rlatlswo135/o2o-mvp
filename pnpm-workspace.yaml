packages:
  - client
  - server
  - shared
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^1.0.0
  vite-plus: ^1.0.0
  typescript: ^7.0.0
  "@types/node": ^24.0.0
  zod: ^4.6.5
  # oRPC는 v2 베타를 쓴다. 베타 사이 깨지는 변경이 있으므로 정확한 버전으로 고정한다.
  "@orpc/client": 2.0.0-beta.43
  "@orpc/contract": 2.0.0-beta.43
  "@orpc/nest": 2.0.0-beta.43
  "@orpc/openapi": 2.0.0-beta.43
  "@orpc/server": 2.0.0-beta.43
allowBuilds:
  esbuild: true
  lightningcss: true
  pnpm: true
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
